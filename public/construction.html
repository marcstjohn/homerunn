<style>
  :root{
    --ink:#111111;
    --deep:#0B0B0B;
    --amber:#D97706;
    --white:#FFFFFF;
    --soft:#A3A3A3;
    --muted:#6B7280;
    --line:#262626;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--white);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:16px;
    line-height:1.65;
    display:flex;
    flex-direction:column;
    min-height:100%;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  /* amber hairline + faint diamond texture, same as the site's dark sections */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg width='160' height='160' viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='40,22 58,40 40,58 22,40' fill='none' stroke='%23D97706' stroke-width='0.7' stroke-opacity='0.10'/%3E%3Cpolygon points='120,14 146,40 120,66 94,40' fill='none' stroke='%23D97706' stroke-width='0.7' stroke-opacity='0.13'/%3E%3Cpolygon points='40,96 64,120 40,144 16,120' fill='none' stroke='%23D97706' stroke-width='0.7' stroke-opacity='0.12'/%3E%3Cpolygon points='120,85 155,120 120,155 85,120' fill='none' stroke='%23D97706' stroke-width='0.8' stroke-opacity='0.17'/%3E%3C/svg%3E");
    background-size:160px 160px;
    -webkit-mask-image:linear-gradient(to bottom,black 0%,transparent 60%);
    mask-image:linear-gradient(to bottom,black 0%,transparent 60%);
  }
  body::after{
    content:'';position:fixed;top:0;left:0;right:0;height:1px;pointer-events:none;
    background:linear-gradient(to right,transparent 0%,rgba(217,119,6,.55) 50%,transparent 100%);
  }

  .wrap{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 24px;
  }
  .col{width:100%;max-width:600px}

  /* the real outlined wordmark; each letter rises in order, like the logo itself */
  .mark{display:block;width:250px;height:auto;margin:0 0 52px;overflow:visible}
  .mark path{fill:var(--amber)}

  .eyebrow{
    display:inline-flex;align-items:center;gap:12px;
    font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    color:var(--amber);margin:0 0 20px;
  }
  .eyebrow::before{content:'';width:28px;height:1px;background:var(--amber)}

  h1{
    font-family:'Sora',system-ui,sans-serif;
    font-weight:700;
    font-size:clamp(34px,6vw,52px);
    line-height:1.06;
    letter-spacing:-.025em;
    margin:0 0 22px;
  }

  .lede{font-size:19px;color:var(--soft);margin:0 0 44px;max-width:46ch}

  .panel{
    background:#161616;
    border:1px solid var(--line);
    border-radius:3px;
    padding:22px 26px;
    display:grid;
    gap:14px;
  }
  .row{display:flex;align-items:baseline;gap:16px;font-size:15px}
  .row .k{
    flex:0 0 110px;
    font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);
  }
  .row .v{color:var(--white);font-weight:500}
  .dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--amber);margin-right:10px;vertical-align:middle;
    box-shadow:0 0 0 0 rgba(217,119,6,.6);
    animation:ping 2.4s ease-out infinite;
  }
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(217,119,6,.55)}70%,100%{box-shadow:0 0 0 9px rgba(217,119,6,0)}}

  footer{
    position:relative;
    border-top:1px solid #1F1F1F;
    background:var(--deep);
    padding:22px 24px;
    text-align:center;
    font-size:13px;
    color:var(--muted);
  }
  footer b{color:var(--white);font-weight:600}

  @media (prefers-reduced-motion:no-preference){
    .mark path{animation:pop .6s cubic-bezier(.2,.8,.3,1) both}
    .mark path:nth-child(1){animation-delay:.05s}
    .mark path:nth-child(2){animation-delay:.10s}
    .mark path:nth-child(3){animation-delay:.15s}
    .mark path:nth-child(4){animation-delay:.20s}
    .mark path:nth-child(5){animation-delay:.25s}
    .mark path:nth-child(6){animation-delay:.30s}
    .mark path:nth-child(7){animation-delay:.35s}
    .mark path:nth-child(8){animation-delay:.40s}
    .rise{animation:rise .8s cubic-bezier(.2,.7,.3,1) .45s both}
  }
  @keyframes pop{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}

  @media (max-width:520px){
    .wrap{padding:48px 20px}
    .mark{width:200px;margin-bottom:40px}
    .lede{font-size:17px}
    .row{flex-direction:column;gap:2px}
    .row .k{flex:none}
  }
</style>
</head>
